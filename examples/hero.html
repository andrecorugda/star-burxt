<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>star-burxt</title>

<!--
  The page. It has no knowledge of your app in it — copy it once per project and leave it alone.

  Three things happen here and nothing else: a root element exists, the driver is handed the module,
  and the state it should start from is read out of the page if the server put one there. Everything
  about what is drawn, what a click means, and what is fetched lives in your component.
-->
<!--
  Your component's stylesheet. Generating writes one per component — `===style.local` with every
  selector scoped, `===style.global` as you wrote it — so the page links it and never has to know
  what is in it.
-->
<link rel="stylesheet" href="./Hero.css">

<style>
  html { background: #f6f7fa; }
  body { margin: 0; }
</style>

<div id="root"></div>

<!--
  Server-rendered state, when there is any. `serve()` embeds it so the browser continues from THE
  SAME value rather than fetching it again — which is what makes the first paint and the first frame
  identical instead of merely similar.
-->
<script type="application/json" id="star-state">
{"tasks":[
  {"id":1,"label":"Read the tour","done":true},
  {"id":2,"label":"Write a component","done":true},
  {"id":3,"label":"Give it a style section","done":false},
  {"id":4,"label":"Fetch something in commands","done":false},
  {"id":5,"label":"Ship it","done":false}],
 "left":3}
</script>

<script type="module">
  import { mount } from './app.js';
  import { reconcile } from './reconcile.js';

  const state = document.getElementById('star-state');

  await mount({
    wasm: new URL('./hero.wasm', import.meta.url),
    root: document.getElementById('root'),
    component: 'hero',
    initial: (state && state.textContent.trim()) || '{}',
    // Patch the page instead of replacing it, so typing does not lose the caret.
    reconcile,
  });
</script>
</html>
