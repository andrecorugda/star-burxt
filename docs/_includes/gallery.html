    :!div:

    :for: line in model.lines key to_string(line.id)
        :div: class=line
            :button: class="bx-btn bx-btn-icon" child={"−"} on:click=Msg.Fewer(string_to_int(key, 0)) :!button:
            :button: class="bx-btn bx-btn-icon" child={"+"} on:click=Msg.More(string_to_int(key, 0)) :!button:
            :div:
                :div: class=name child={line.name} :!div:
                :div: class=each child={money(line.each) + " each × " + to_string(line.count)} :!div:
            :!div:
            :div: class=amount child={money(line_total(line))} :!div:
        :!div:
    :!for:

    :hr: class=bx-divider :!hr:

    :div: class=sum
        :span: class=bx-muted child={"subtotal " + money(subtotal(model.lines)) + "  ·  service 12.5% " + money(service(model.lines))} :!span:
        :span: class="bx-figure amount" child={money(cart_total(model.lines))} :!span:
    :!div:
:!div:

:div: class=bx-card
    :h2: class=bx-title child={"Split the bill"} :!h2:
    :p: class=bx-muted
    Dividing money cannot lose a penny, so the shares are computed rather than rounded.
    :!p:
    :div: class=bx-row
        :button: class=bx-btn child={"one bill"} on:click=Msg.Split(1) :!button:
        :button: class=bx-btn child={"two ways"} on:click=Msg.Split(2) :!button:
        :button: class=bx-btn child={"three ways"} on:click=Msg.Split(3) :!button:
    :!div:
    :p: class="shares bx-mono" child={shares(model)} :!p:
:!div:</code></pre>{% endraw %}
    </figure>
  </section>
  <section class="shelf-slide" id="shelf-board">
    <figure class="shelf-shot">
      <img src="{{ site.baseurl }}/assets/gallery/board.png" width="720" height="470"
           loading="lazy" alt="Board.sbmx running in a browser">
      <figcaption><strong>Board.sbmx</strong> <span>noughts and crosses: rules as a pure function, a winner derived rather than trusted</span></figcaption>
    </figure>
    <figure class="shelf-code">
      <!-- Wrapped in raw, or Jekyll eats the markup: a double brace is a slot in a star document and a
           Liquid expression to Jekyll, so an unwrapped panel either fails the build or renders the wrong
           thing silently. tools/liquid.bx caught it the moment the page was generated, which is the gate
           earning its place — I had already pushed. -->
      {% raw %}<pre><code class="language-sbmx">:props: model: Model
:!props:

:div: class=bx-card
    :div: class=bx-spread
        :h2: class=bx-title child={"Noughts and crosses"} :!h2:
        :span: class=bx-badge child={verdict(model)} :!span:
    :!div:

    :hr: class=bx-divider :!hr:

    :div: class=grid
        :for: square in model.squares key to_string(square.id)
            :button: class={{ face(square) }} child={square.mark} on:click=Msg.Play(string_to_int(key, 0)) :!button:
        :!for:
    :!div:

    :div: class=bx-row
        :button: class=bx-btn child={"new game"} on:click=Msg.Again :!button:
    :!div:
:!div:</code></pre>{% endraw %}
    </figure>
  </section>
  </div>
</div>
