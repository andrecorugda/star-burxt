# star-burxt's documentation site, served from /docs on main at star.burxt-lang.org.
#
# No theme. The stylesheet is burxt-lang.org's, copied rather than reimplemented, so the three
# sites are one site: `assets/site.css` and `assets/site.js` are byte copies of the upstream files
# and should be re-copied rather than edited when they change there. BMX's site does the same, for
# the same reason and from the same source.
title: star-burxt
description: "A front-end framework written in Burxt. A .sbmx file is a component — markup and logic in one file — and the compiler judges what your buttons do."
url: https://star.burxt-lang.org
baseurl: ""

has_branding: true

# ---- versioning -------------------------------------------------------------------------------
#
# star-burxt versions independently of Burxt. It is a framework with its own release cadence, and
# tying its number to the language's would mean either a version bump with nothing in it or a fix
# waiting for a language release — which is the cost that moved it out of `lib/` in the first place.
#
# `star_version` is what a reader is looking at. `star_requires` is the Burxt it needs, and it is
# stated rather than implied: v1.1.0 shipped an `lib/html.bx` whose builders are not `pure`, and
# purity is transitive, so on that release a `pure` view cannot be written at all.
star_version:  "0.2.0"
star_series:   "0.2"
star_requires: "1.2 (from source — see the set-up page)"

# **Every documented version, newest first. The first entry is the live one.**
#
# Driven from a list rather than hard-coded options in the layout, so freezing a version is a
# directory and ONE line here. burxt-lang.org's picker names its two versions inside the template,
# which means the layout has to be edited to publish a release -- the kind of step that gets missed
# in the release nobody was worried about.
#
# To freeze 0.1 when 0.2 ships: copy the pages to `docs/0.1/`, add `- number: "0.1"` below, and
# change `star_series` above. The picker follows.
versions:
  - number: "0.1"
    label:  "0.1 (latest)"
    path:   ""

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
exclude: [_site]
