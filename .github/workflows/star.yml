# star-burxt's own CI.
#
# The guarantee test used to live in Burxt's `tests/runner.rs`, because star-burxt lived in Burxt's
# `lib/`. It moves with the code: a suite that tests a package the repository no longer contains is
# testing something it cannot see change.
#
# **This INSTALLS Burxt rather than building it, and that is deliberate.** Since the standard library
# is found by the compiler's installation and never beside the program, a build directory has no
# library at all — so a CI that built the compiler would have to pin BURXT_LIB and would then be
# exercising a path no user takes. Installing exercises the path they do.
name: star-burxt
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # **`fetch-tags`, because `tools/refs.py` checks that every ref the documentation advertises
      # exists.** A default checkout is shallow and carries no tags, so the moment a page names one
      # the check would fail here while passing on every developer's machine — a red build about a
      # correct document, which is the most confusing kind.
      - uses: actions/checkout@v4
        with:
          fetch-tags: true
          fetch-depth: 0


      # **A RELEASED compiler, pinned — and this paragraph replaces one that had been true all day.**
      #
      # A package should pin a release: building against a moving branch silently consumes unreleased
      # features, and a badge that goes red for somebody else's in-progress work is a badge people
      # learn to ignore. star-burxt argues that on its own install page, and until v1.3.0 it could not
      # follow its own advice — v1.2.0 refused two things every component does:
      #
      #     update(msg, m) -> Model  holding a list      needed the relay fix
      #     pure function … json_render(…)               needed the `pure` sweep on the library
      #
      # Both are in 1.3.0, **checked by compiling those two programs against the released binary**
      # rather than by reading the notes — which is the same distinction that caught us at 1.2.0,
      # where the fixes were on the branch and not in the tag. The whole suite was then run against
      # the release before this step changed.
      #
      # Raising this pin is a decision, not maintenance: it is what the badge is about.
      - name: Install Burxt
        env:
          # **The newest RELEASE, not the floor.** `docs/install.md` says "1.3.0 or newer" and that claim is
          # about capabilities rather than a number — the step below compiles the two programs that decide
          # whether star can be built at all, so it tests what star needs rather than what it is pinned to.
          # CI runs what a reader would install today, which is 1.4.0: verified by checksum against
          # SHA256SUMS, and star is green on it — every gate, all 21 components, all nine wasm-driven tests.
          BURXT_VERSION: "1.4.0"
        run: |
          set -eux
          curl -fsSL -o /tmp/burxt.tar.gz \
            "https://github.com/andrecorugda/burxt/releases/download/v${BURXT_VERSION}/burxt-${BURXT_VERSION}-linux-x86_64.tar.gz"
          mkdir -p /tmp/burxt && tar xzf /tmp/burxt.tar.gz -C /tmp/burxt --strip-components=1
          sudo install -d /usr/local/bin /usr/local/lib/burxt
          sudo install -m 755 /tmp/burxt/burxt /usr/local/bin/burxt
          sudo install -m 644 /tmp/burxt/lib/*.bx /usr/local/lib/burxt/
          burxt --version | head -1

      # **The two programs that kept this project on a branch, run against the release that claims to
      # compile them.** Kept as a step rather than deleted with the pin: the next version bump is
      # exactly when someone wants to know whether these still pass, and a check that only ever ran
      # once is a check nobody can repeat.
      - name: The release compiles what a component needs
        run: |
          set -eux
          cat > /tmp/gate-relay.bx <<'BX'
          class Task  { id: Int, label: String }
          class Model { tasks: [Task], count: Int }
          enum Msg { Add }
          pure function update(msg: Msg, m: Model) -> Model allocates {
              match msg {
                  Add => {
                      let mutable out: [Task] = [];
                      let mutable i: Int = 0;
                      while i < len(m.tasks) { let k: Int = push(out, m.tasks[i]); i += 1; }
                      let n: Int = push(out, Task { id: m.count, label: "new" });
                      return Model { tasks: out, count: m.count + 1 };
                  }
              }
          }
          let mutable start: [Task] = [];
          let a: Int = push(start, Task { id: 1, label: "one" });
          let next: Model = update(Msg.Add, Model { tasks: start, count: 2 });
          print("tasks: " + to_string(len(next.tasks)));
          BX
          cat > /tmp/gate-pure.bx <<'BX'
          use "std/json.bx";
          class Model { count: Int }
          pure function to_text(m: Model) -> String allocates {
              let mutable f: [Field] = [];
              let a: Int = push(f, json_field("count", json_int(m.count)));
              return json_render(json_object(f));
          }
          print(to_text(Model { count: 7 }));
          BX
          test "$(burxt run /tmp/gate-relay.bx)" = "tasks: 2"
          test "$(burxt run /tmp/gate-pure.bx)" = '{"count":7}'

      # **Third, not first, and the order is the point.** This guard was Python and ran before Burxt
      # was installed; now that it IS Burxt it needs the compiler, so it moved below the install. That
      # is the cost of using your own language for your own tooling, and it is worth paying: the
      # replacement gets `file_walk` returning an `Option`, so a missing `docs/` and a `docs/` with no
      # pages in it stop being the same answer — the Python reported "0 pages, all wrapped" for both.
      - name: The documentation site is Liquid-safe
        run: |
          set -eux
          burxt build tools/liquid.bx -o star-liquid
          ./star-liquid

      # A `sed` that rewrote a `dependency bmx …` line lived here, and **it matched nothing** —
      # `burxt.package` had no such line at the time. A `sed -i` whose pattern misses exits 0, so the
      # step was green and named after work it was not doing. Worse, it was DATED: the day BMX left
      # `lib/` and the manifest gained a real dependency, that pattern would finally match and
      # rewrite it to `/tmp/burxt/lib` — a directory that by then does not hold `bmx.bx`, so the move
      # would have looked like the thing that broke star. Deleted rather than repointed.
      #
      # This is what replaces it, and it does the real thing: `burxt fetch` clones BMX at the commit
      # `burxt.package` pins and writes `burxt.lock`. **No rewriting.** The manifest CI uses is the
      # manifest a user gets, which is the only version of this step that can prove anything.
      - name: Fetch the BMX dependency at its pinned commit
        run: |
          set -eux
          burxt fetch
          cat burxt.lock

      # **Built ONCE, here, because four later steps run it.** It used to be built inside the
      # documentation step — which sat last, so the three wasm steps added above it failed with
      # `./star-generate: No such file or directory`. A tool built as a side effect of the step that
      # happened to need it first is a tool whose availability depends on step order.
      - name: Build the generator
        run: burxt build examples/generate.bx -o star-generate

      - name: Build the checker
        run: burxt build examples/check.bx -o star-check

      # `star-build` is a Burxt program, not a shell script — it was one, and Andre's objection was
      # right: a project arguing that a language catches what review misses should not do its own
      # work in a language that cannot. The shell version word-split `$exports` on purpose and left a
      # path unquoted by accident, and the two look the same in a diff.
      - name: Build the builder
        run: burxt build examples/build.bx -o star-build

      # **All three layers, on every component in this repository.** A person editing a `.sbmx` does
      # not care which layer refuses them, and until this existed they had to run three tools to find
      # out. The third — the compiler, on the generated component — is the one nobody else can do,
      # and it is the whole reason star exists.
      - name: Every component in this repository checks clean
        run: |
          set -eux
          for doc in examples/*.sbmx; do ./star-check "$doc"; done

      # **The server, over the real protocol.** A server tested only by opening an editor is a
      # server whose protocol handling is a guess — and the last assertion, that a clean document
      # reports nothing, comes after three that prove it can find things. A server that answered
      # nothing to everything would pass that one alone.
      # **The file that decides how the editor BEHAVES had no test across four releases.** The grammar
      # had one, the server had one; `language-configuration.json` keyed folding on `:::` and BMX
      # respelled the fence in 0.7, so folding a block was silently dead in the shipped extension. A
      # fold that does not appear looks like a feature that was never there, so nobody reports it.
      # **A version claim is a claim like any other.** The README told readers to depend on `v0.2.0`,
      # a tag that does not exist, while the install page said `v0.1.0` — 55 commits behind and unable
      # to read a single example on the site. Two pages, two answers, neither true, nothing checking.
      - name: Every ref the documentation advertises exists
        run: |
          set -eux
          burxt build tools/refs.bx -o star-refs
          ./star-refs

      # **A stale NOT-DONE is found by nobody, where a stale DONE is found by the first person who
      # tries it.** Chapter 4 said "you cannot put a button inside a `for` yet" and quoted an error
      # star had stopped emitting, so that page turned readers away from a working feature for as long
      # as it had one. Every claim on `not-done.md` now carries a probe, and the mechanism is the
      # language session's — they hit the same class in four documents and described the shape.
      - name: Every published limitation still holds
        run: |
          set -eux
          burxt build tools/limits.bx -o star-limits
          ./star-limits

      # **star's README promised three names, and the three could not be used** — `star_generate`
      # takes `[StarKnown]`, so `StarKnown` was mandatory and unlisted. This builds a REAL dependent
      # package, because the package boundary is the only place `public` is enforced: a non-`public`
      # function called from another file compiles fine, which looks like proof that the keyword is
      # decoration and is not. It also carries its own control — a published name accepted across the
      # same boundary — since a refusal alone could just as easily be a typo.
      - name: The published surface is the one star actually has
        run: |
          set -eux
          burxt build tools/surface.bx -o star-surface
          ./star-surface

      - name: The editor configuration behaves
        run: node editors/vscode/config.mjs

      - name: The language server speaks the protocol
        run: STAR_CHECK=./star-check node editors/lsp/drive-lsp.mjs

      # **Runs the test, not the packer.** The obvious shape here is `pack.py && inspect`, and it is
      # the shape that cannot work: it regenerates the artefact it is verifying, so it overwrites the
      # evidence one line before looking for it and a stale committed .vsix passes forever. The test
      # repacks into a comparison and restores the committed bytes, so this step sees staleness.
      # It also spawns the server inside each documented install and asks it for its version, which is
      # where the 0.0.0 copy install was found.
      - name: The extension packages, and answers its version through every install
        run: |
          set -eux
          python3 tests/extension.py
          python3 tests/extension.py --prove-it

      # **Runs star from OUTSIDE, with the commands only on PATH.** Every other step here runs from the
      # repository root, where `./star-generate` and a PATH lookup resolve to the same file — so no other
      # step can see a hardcoded relative path, and one shipped.
      - name: star used as a dependency, from outside
        run: |
          set -eux
          burxt build tests/consuming.bx -o star-consuming
          ./star-consuming
          ./star-consuming --prove-it

      # **The ledger, not a cap.** Every non-Burxt file declares why it is not, in its own first twenty
      # lines, and this fails on one that declares none. A prose audit goes stale the moment somebody
      # adds a file; a threshold is a number somebody raises when it is inconvenient. The rule is to
      # know what the number is, and which column it sits in.
      - name: Every line that is not Burxt says why
        run: |
          set -eux
          burxt build tools/languages.bx -o star-languages
          ./star-languages
          ./star-languages --prove-it

      - name: A .sbmx document becomes a component the compiler judges
        run: |
          set -eux
          burxt build tests/guarantees.bx -o star-guarantees
          ./star-guarantees
          python3 tests/guarantees.py

      # **The site's own syntax colouring, checked.** A highlighter that stops working fails
      # silently: the page renders and the code is grey again, which is the exact state `code.js`
      # exists to end. Nothing else in this build would notice.
      - name: The site colours all three languages
        run: node tools/paints.mjs

      # **The landing page's showcase is generated, so CI checks it is CURRENT.** The panel shows
      # `examples/Hero.sbmx` verbatim; if the component changes and nobody regenerates, the page ends
      # up showing code that does not produce the screenshot beside it — which is the one thing a
      # showcase must never do. The screenshot itself needs a browser, so it is not remade here; the
      # image's own dimensions are read out of the PNG, so a stale image shows up as a diff too.
      - name: The showcase matches the component it claims to show
        run: |
          set -eux
          burxt build tools/showcase.bx -o star-showcase
          ./star-showcase
          git diff --exit-code -- docs/_includes/showcase.html

      # **Every example on the site is generated.** A tutorial that teaches something the tool
      # refuses is worse than no tutorial: the reader concludes they made the mistake. This found
      # exactly that the day it was written — chapter 1 opened with a document the generator
      # refuses, so the first lesson on the site did not work.
      # **The driver, against a real WebAssembly module.** Nothing native can catch what this
      # catches: a component that round-tripped perfectly under `burxt run` exited 70 on its second
      # frame in the browser, because the driver stubbed 128-bit multiply to zero — which produces
      # wrong products rather than failing, so the overflow check fired on a correct program.
      # **Through `star-build`, which is what chapter 6 tells a reader to run.** The linker line
      # used to live in the documentation, where it named two entry points that had been renamed —
      # it would not have linked. A recipe only a person copies is a recipe nothing checks, so the
      # script is the recipe and CI is what runs it.
      - name: The driver carries the state, in real wasm
        run: |
          set -eux
          ./star-build examples/Todos.sbmx todos /tmp/build
          node examples/drive.mjs /tmp/build/todos.wasm

      - name: Commands and subscriptions, in real wasm
        run: |
          set -eux
          ./star-build examples/Feed.sbmx feed /tmp/build
          node examples/drive-feed.mjs /tmp/build/feed.wasm

      # **A selector nothing can match has no failure mode.** The CSS is valid, the class never appears,
      # and the page looks like a design decision — so no compiler, test or screenshot reports it. Both of
      # `Showcase.sbmx`'s were real: `.tab.on` meant every tab looked identical INCLUDING the one you were
      # on, and `.empty` meant an empty list showed nothing at all. A stylesheet is a record of intent and
      # those were two intents nobody wired.
      #
      # Conservative on purpose, because a false positive here is a rule somebody deletes: a class may
      # arrive from a `class=` value or from a String in the `===bx` section, and a compound selector needs
      # ONE string carrying BOTH names — which is the distinction that found `.tab.on`, since `on` alone
      # appears in every `on:click` in the file.
      - name: Every CSS rule can match something the markup renders
        run: |
          set -eux
          burxt build tools/reachable.bx -o star-reachable
          ./star-reachable

      # **A collection is a claim about coverage, and a claim nobody runs goes stale in the direction
      # nobody checks.** Either a document arrives and no row is added — so the table understates star and
      # the playground never shows it — or a row outlives its file and sends a reader nowhere. Both
      # directions, plus the rule that every row must say what its document is FOR: a table of names is an
      # index, and the point of this one is the reasons.
      - name: The collection and the directory agree
        run: |
          set -eux
          burxt build tools/collection.bx -o star-collection
          ./star-collection

      # **One set was answering two different questions and was wrong both ways.** What an element may
      # CONTAIN is not what an element IS: `select` is phrasing content and holds `option`s, every
      # heading holds text and is flow. The check for what may sit inside a phrasing element asked
      # "does the child take flow?", so `<label>size <select>…</select></label>` was refused — nine of
      # ten valid pairs were — while `<button><h1>` was ACCEPTED, the exact case star.bx's own comment
      # says STAR-E005 exists to refuse.
      #
      # Both columns, because neither alone can hold a content model: a suite of refusals cannot catch a
      # rule that refuses too much, and a suite of acceptances cannot catch one that permits too much.
      - name: HTML's content model, both ways
        run: |
          set -eux
          burxt build tools/content.bx -o star-content
          ./star-content

      # **`:for: … key …` has emitted `data-star-key` since it existed and the reconciler ignored it.**
      # The file's own comment called keys "the fix" and said they waited on a format decision that had
      # already been made. It also claimed positional matching was merely wasteful on a reorder. It was
      # not: measured in a real browser, typing in the third row and moving THAT row up left the caret
      # at position two, which by then held a different record — the next keystroke edited the wrong
      # row, with the state and the DOM both correct.
      #
      # There is no DOM here and star takes no dependency it does not own, so this checks the ORDERING
      # against a small DOM that first proves its own `insertBefore` moves rather than copies. The
      # focus-and-caret half is browser-measured and the file records the steps.
      - name: A keyed list ends up in the order the view asked for
        run: node tools/orders.mjs

      # **HTML has no false**, so `checked="false"` is checked and the only way to say "not checked" is
      # for the attribute to be absent. Until `checked={{ … }}` compiled to a DECISION rather than a
      # value, a form could not show its own state: rendering with `agree: true` produced an unticked box
      # and the client hydrated to the same wrong HTML. Run twice, because the property is presence AND
      # absence — one state cannot tell an attribute that is always there from one that never is.
      - name: A form rendered on the server shows its own state
        run: |
          set -eux
          ./star-generate examples/Choices.sbmx choices --fragment > /tmp/build/choices-r.bx
          burxt build /tmp/build/choices-r.bx -o /tmp/build/choices-render
          node tools/flags.mjs /tmp/build/choices-render

      # **A game, because a form asks star one question and a game asks the other four:** a tick that
      # runs only while the state says so, four global keys, a list that moves and grows every frame,
      # and a rule that ends it. Two real defects came out of writing it — the first paint never told
      # the host what it had painted, and a state change that came FROM a subscription never
      # re-evaluated subscriptions, so a game that ends on a tick ticked for ever. `drive-feed.mjs` had
      # covered that path since subscriptions existed, through a click, which is the one path that
      # already worked.
      - name: The game plays, ends, and starts again
        run: |
          set -eux
          ./star-build examples/Snake.sbmx snake /tmp/build
          node tools/plays.mjs /tmp/build/snake.wasm

      # **What a component RECEIVES from an event, one channel at a time.** The fake DOM pinned
      # `clientX` to `undefined` and never supplied `clientY`, so every pointer event took the empty
      # arm of the driver's `valueOf` and the coordinate path had no coverage to lose. Proved by
      # breaking the subject: swapping x for y and deleting the rounding broke NOTHING across five test
      # programs. Third instance of one shape here — a stub that discards what the code reads, which a
      # search for unused parameters cannot find, because the parameter is absent from the signature
      # rather than unused.
      - name: Every event channel carries what the component reads
        run: |
          set -eux
          ./star-build examples/Echo.sbmx echo /tmp/build
          node tools/values.mjs /tmp/build/echo.wasm

      # **What a SERVER receives, at a real HTTP server rather than a stub.** `drive-feed.mjs` fakes
      # the browser with `globalThis.fetch = (url) => …` — one parameter, so the options object
      # carrying method, body and headers goes on the floor. Commands have been tested since they
      # existed and the wire had never been looked at, which is how a `send` reached a real Laravel app
      # as `text/plain` with no CSRF token: 419 on any `web` route, and on an `api` one
      # `$request->input('label')` came back EMPTY with nothing reported anywhere.
      - name: What a server receives when a component saves
        run: |
          set -eux
          ./star-build examples/Poster.sbmx poster /tmp/build
          node tools/posts.mjs /tmp/build/poster.wasm

      # **A component rendered where the BACKEND owns the page.** The browser build alone ships an
      # empty `<div id="root">`, so the first paint waits on 54 KB of wasm — the flash SSR exists to
      # remove. This checks the native renderer and the wasm module produce the SAME bytes from the
      # same state, which is what makes a hydration mismatch impossible rather than unlikely.
      - name: A server-rendered fragment matches what the browser renders
        run: |
          set -eux
          ./star-generate examples/Poster.sbmx poster --fragment > /tmp/build/render.bx
          burxt build /tmp/build/render.bx -o /tmp/build/poster-render
          echo '{"status":"idle","url":"/tasks"}' | /tmp/build/poster-render > /tmp/build/served.html
          node tools/hydrates.mjs /tmp/build/poster.wasm poster /tmp/build/served.html

      # **The component in the landing page's picture, run.** The screenshot is the strongest claim
      # the site makes, and a hero that stopped working would keep looking correct — the image is a
      # file. So the same `.sbmx` is built and mounted here, which is what makes the picture evidence
      # rather than decoration.
      - name: The component in the showcase actually runs
        run: |
          set -eux
          ./star-build examples/Hero.sbmx hero /tmp/build
          node tools/mounts.mjs /tmp/build/hero.wasm hero

      # The strongest claim star makes, checked rather than asserted — WITH its control, so the
      # grep cannot pass by being unable to find anything.
      - name: Server code cannot reach the browser
        run: |
          set -eux
          ./star-build examples/Served.sbmx page /tmp/build
          node examples/prove-partition.mjs /tmp/build/page.o /tmp/build/page.wasm

      - name: Every example in the documentation actually works
        run: python3 verify-docs.py
