# star-burxt's own CI.
#
# The guarantee test used to live in Burxt's `tests/runner.rs`, because star-burxt lived in Burxt's
# `lib/`. It moves with the code: a suite that tests a package the repository no longer contains is
# testing something it cannot see change.
#
# **This INSTALLS Burxt rather than building it, and that is deliberate.** Since the standard library
# is found by the compiler's installation and never beside the program, a build directory has no
# library at all — so a CI that built the compiler would have to pin BURXT_LIB and would then be
# exercising a path no user takes. Installing exercises the path they do.
name: star-burxt
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The documentation site is Liquid-safe
        run: python3 check.py

      # **BUILT FROM `develop`, NOT FROM THE RELEASE, and this is not laziness.**
      #
      # A package should pin a released compiler: building against a moving branch silently consumes
      # unreleased features, and a badge that goes red for somebody else's in-progress work is a badge
      # people learn to ignore. star-burxt argues that on its own install page.
      #
      # It cannot follow it yet. **v1.2.0 cannot compile a star-burxt component**, measured against the
      # released binary rather than inferred from a changelog:
      #
      #     update(msg, m) -> Model  holding a list
      #       error: cannot return Model, because its storage lives in a region
      #       -> needs the relay fix, which landed AFTER the tag
      #
      #     pure function … json_render(…)
      #       error: `json_render` is not declared `pure`
      #       -> needs the marker sweep on the standard library, also after the tag
      #
      # A component's `update` returns a record holding a list, and its `to_text` is `pure` and calls
      # the JSON encoder. Both are refused by 1.2.0. So this step stays on `develop` until a release
      # contains both, and **the moment one does, this comment is the thing to delete** — checked by
      # running the two programs above against the candidate, not by reading its notes.
      - name: Install Burxt
        run: |
          set -eux
          git clone --depth 1 --branch develop https://github.com/andrecorugda/burxt.git /tmp/burxt
          sudo apt-get update -qq && sudo apt-get install -y llvm-18-dev libpolly-18-dev
          cd /tmp/burxt && LLVM_SYS_181_PREFIX=/usr/lib/llvm-18 cargo build --release
          sudo install -d /usr/local/bin /usr/local/lib/burxt
          sudo install -m 755 target/release/burxt /usr/local/bin/burxt
          sudo install -m 644 lib/*.bx /usr/local/lib/burxt/

      # A `sed` that rewrote a `dependency bmx …` line lived here, and **it matched nothing** —
      # `burxt.package` had no such line at the time. A `sed -i` whose pattern misses exits 0, so the
      # step was green and named after work it was not doing. Worse, it was DATED: the day BMX left
      # `lib/` and the manifest gained a real dependency, that pattern would finally match and
      # rewrite it to `/tmp/burxt/lib` — a directory that by then does not hold `bmx.bx`, so the move
      # would have looked like the thing that broke star. Deleted rather than repointed.
      #
      # This is what replaces it, and it does the real thing: `burxt fetch` clones BMX at the commit
      # `burxt.package` pins and writes `burxt.lock`. **No rewriting.** The manifest CI uses is the
      # manifest a user gets, which is the only version of this step that can prove anything.
      - name: Fetch the BMX dependency at its pinned commit
        run: |
          set -eux
          burxt fetch
          cat burxt.lock

      # **Built ONCE, here, because four later steps run it.** It used to be built inside the
      # documentation step — which sat last, so the three wasm steps added above it failed with
      # `./star-generate: No such file or directory`. A tool built as a side effect of the step that
      # happened to need it first is a tool whose availability depends on step order.
      - name: Build the generator
        run: burxt build examples/generate.bx -o star-generate

      - name: Build the checker
        run: burxt build examples/check.bx -o star-check

      # `star-build` is a Burxt program, not a shell script — it was one, and Andre's objection was
      # right: a project arguing that a language catches what review misses should not do its own
      # work in a language that cannot. The shell version word-split `$exports` on purpose and left a
      # path unquoted by accident, and the two look the same in a diff.
      - name: Build the builder
        run: burxt build examples/build.bx -o star-build

      # **All three layers, on every component in this repository.** A person editing a `.sbmx` does
      # not care which layer refuses them, and until this existed they had to run three tools to find
      # out. The third — the compiler, on the generated component — is the one nobody else can do,
      # and it is the whole reason star exists.
      - name: Every component in this repository checks clean
        run: |
          set -eux
          for doc in examples/*.sbmx; do ./star-check "$doc"; done

      # **The server, over the real protocol.** A server tested only by opening an editor is a
      # server whose protocol handling is a guess — and the last assertion, that a clean document
      # reports nothing, comes after three that prove it can find things. A server that answered
      # nothing to everything would pass that one alone.
      - name: The language server speaks the protocol
        run: STAR_CHECK=./star-check node editors/lsp/drive-lsp.mjs

      - name: A .sbmx document becomes a component the compiler judges
        run: python3 test.py

      # **The site's own syntax colouring, checked.** A highlighter that stops working fails
      # silently: the page renders and the code is grey again, which is the exact state `code.js`
      # exists to end. Nothing else in this build would notice.
      - name: The site colours all three languages
        run: node tools/paints.mjs

      # **The landing page's showcase is generated, so CI checks it is CURRENT.** The panel shows
      # `examples/Hero.sbmx` verbatim; if the component changes and nobody regenerates, the page ends
      # up showing code that does not produce the screenshot beside it — which is the one thing a
      # showcase must never do. The screenshot itself needs a browser, so it is not remade here; the
      # image's own dimensions are read out of the PNG, so a stale image shows up as a diff too.
      - name: The showcase matches the component it claims to show
        run: |
          set -eux
          python3 tools/showcase.py
          git diff --exit-code -- docs/_includes/showcase.html

      # **Every example on the site is generated.** A tutorial that teaches something the tool
      # refuses is worse than no tutorial: the reader concludes they made the mistake. This found
      # exactly that the day it was written — chapter 1 opened with a document the generator
      # refuses, so the first lesson on the site did not work.
      # **The driver, against a real WebAssembly module.** Nothing native can catch what this
      # catches: a component that round-tripped perfectly under `burxt run` exited 70 on its second
      # frame in the browser, because the driver stubbed 128-bit multiply to zero — which produces
      # wrong products rather than failing, so the overflow check fired on a correct program.
      # **Through `star-build`, which is what chapter 6 tells a reader to run.** The linker line
      # used to live in the documentation, where it named two entry points that had been renamed —
      # it would not have linked. A recipe only a person copies is a recipe nothing checks, so the
      # script is the recipe and CI is what runs it.
      - name: The driver carries the state, in real wasm
        run: |
          set -eux
          ./star-build examples/Todos.sbmx todos /tmp/build
          node examples/drive.mjs /tmp/build/todos.wasm

      - name: Commands and subscriptions, in real wasm
        run: |
          set -eux
          ./star-build examples/Feed.sbmx feed /tmp/build
          node examples/drive-feed.mjs /tmp/build/feed.wasm

      # **The component in the landing page's picture, run.** The screenshot is the strongest claim
      # the site makes, and a hero that stopped working would keep looking correct — the image is a
      # file. So the same `.sbmx` is built and mounted here, which is what makes the picture evidence
      # rather than decoration.
      - name: The component in the showcase actually runs
        run: |
          set -eux
          ./star-build examples/Hero.sbmx hero /tmp/build
          node tools/mounts.mjs /tmp/build/hero.wasm hero

      # The strongest claim star makes, checked rather than asserted — WITH its control, so the
      # grep cannot pass by being unable to find anything.
      - name: Server code cannot reach the browser
        run: |
          set -eux
          ./star-build examples/Served.sbmx page /tmp/build
          node examples/prove-partition.mjs /tmp/build/page.o /tmp/build/page.wasm

      - name: Every example in the documentation actually works
        run: python3 verify-docs.py
