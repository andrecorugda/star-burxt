# The guard this repository would otherwise not have.
#
# There is no Ruby on the machines this site is written on, so Jekyll only runs after a push and the
# first symptom of a bad page is a site that silently stops updating. `burxt-lang.org` went down for
# exactly one cause -- a page containing `{{` read as a Liquid variable -- and star-burxt's docs show
# slot syntax on nearly every page, so this is the most likely way to break this site.
#
# **It runs on `main` as well as on the branch**, because `main` is what is served. The other workflow
# checks the same thing on `develop`; this one is the last gate before a reader sees it.
#
# The guard is a Burxt program now, so this job installs the compiler to run it. That is a download,
# not a build, and it costs about ten seconds -- the price of a project using its own language for its
# own tooling, which is a price this project should obviously pay.
name: site
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # **v5 and not v7, because v5.0.0 is the change the deprecation is about** — it moves the
      # action to Node 24, and Node 20 being forced out is the warning GitHub prints today. v6
      # and v7 carry further changes nobody here has read or needs.
      - uses: actions/checkout@v5

      - name: Install Burxt
        env:
          # **The same number as `star.yml`, and that is the point.** This said 1.3.0 while the other
          # workflow said 1.4.0 — a difference with no stated reason, which went two minor versions
          # unnoticed. The FLOOR and the CURRENT are allowed to differ; two currents are not.
          # `tools/versions.bx` fails if these two drift apart again.
          BURXT_VERSION: "1.5.0"
        run: |
          set -eux
          curl -fsSL -o /tmp/burxt.tar.gz \
            "https://github.com/andrecorugda/burxt/releases/download/v${BURXT_VERSION}/burxt-${BURXT_VERSION}-linux-x86_64.tar.gz"
          mkdir -p /tmp/burxt && tar xzf /tmp/burxt.tar.gz -C /tmp/burxt --strip-components=1
          sudo install -d /usr/local/bin /usr/local/lib/burxt
          sudo install -m 755 /tmp/burxt/burxt /usr/local/bin/burxt
          sudo install -m 644 /tmp/burxt/lib/*.bx /usr/local/lib/burxt/

      - name: Every page is Liquid-safe, has front matter, and the CNAME is right
        run: |
          set -eux
          burxt build tools/liquid.bx -o star-liquid
          ./star-liquid
